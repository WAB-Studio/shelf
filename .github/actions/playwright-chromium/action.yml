name: playwright-chromium
description: Restore Chromium for the installed Playwright, or download it and save it; the system libraries install either way.

runs:
  using: composite
  steps:
    - name: Read the Playwright version
      id: version
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore the browser
      id: browser
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.version.outputs.version }}

    - name: Install the browser
      if: steps.browser.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install chromium

    # The apt libraries live outside the cache, so a hit still installs them. The runner image already carries what
    # Chromium needs; an apt mirror that does not resolve costs the fonts, never the run.
    - name: Install the system libraries
      shell: bash
      run: |
        for attempt in 1 2 3; do
          timeout 120 npx playwright install-deps chromium && exit 0
          sleep $((attempt * 10))
        done
        echo "::warning::playwright install-deps failed three times; running on the runner image's libraries."

    - name: Save the browser
      if: steps.browser.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browser.outputs.cache-primary-key }}
