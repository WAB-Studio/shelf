name: npm-install
description: Restore the workspace's node_modules for this lockfile and Node, or run npm ci and save them.

runs:
  using: composite
  steps:
    - name: Read the Node version
      id: node
      shell: bash
      run: echo "version=$(node -v)" >> "$GITHUB_OUTPUT"

    # npm ci took 50 s with the npm cache warm; restoring the tree skips the install.
    - name: Restore node_modules
      id: modules
      uses: actions/cache/restore@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}

    - name: Install
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    # Saved right after the install, before a job's builds and linters write their own caches inside it.
    - name: Save node_modules
      if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
