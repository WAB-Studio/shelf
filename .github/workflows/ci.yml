name: CI

on:
  pull_request:
  push:
    branches: [main, integracion]
  # So the browser suite can be driven on demand — to smoke-test the job itself,
  # or to re-run it without an empty commit.
  workflow_dispatch:

# A newer run on the same ref cancels the older one in progress; `main` is never
# cancelled, so every deploy gets its full proof.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Everything that answers in seconds, over files already in the tree, in one
  # job so the setup (checkout, Node, `npm ci`) is paid once instead of six
  # times. No database, no browser, no secret. Each step runs whatever the one
  # before did, so a red names itself. The dictionary asset is committed, so
  # `check:dict` needs no build; it sat red on `integracion` for a day in
  # 2026-09 because nothing ran it. `node:test` ships with Node 22.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-install
      # PageProps and LayoutProps live in generated, gitignored route types.
      # One app at a time: typegen reads the app's own `app/` directory.
      - run: npx next typegen
        working-directory: apps/homefund
      - run: npx next typegen
        working-directory: apps/wordbook
      - run: npx next typegen
        working-directory: apps/timelog
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run check:dict -w apps/wordbook
        if: ${{ !cancelled() }}
      - run: npm run check:unit -w apps/wordbook
        if: ${{ !cancelled() }}
      - run: npm run check:unit -w apps/timelog
        if: ${{ !cancelled() }}
      - run: npm run check:unit -w packages/harness-registry
        if: ${{ !cancelled() }}
      # Pure functions: they pass with no `.env.local` and no stack.
      - run: npm run check:unit -w apps/homefund
        if: ${{ !cancelled() }}

  # Drives the policies on `reading` against the real database, DELETE included
  # — the only proof RNL-10 has. One transaction that always rolls back, so it
  # leaves no row. Also absent until
  # 2026-09-10: the role that makes every policy apply is settled by one shared
  # statement, and nothing in CI watched it.
  policies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No paid model is reachable from here: the key is blank, and every check
    # that reaches a provider stubs `fetch` and throws on any other URL.
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-install
      # `check:sync` reads `--env-file=.env.local`, which the action writes.
      - uses: ./.github/actions/supabase-local
        with:
          apps: wordbook
      - run: npm run check:sync -w apps/wordbook
      - run: npm run check:grants -w apps/wordbook
      - run: npm run check:sign-in-budget -w apps/wordbook
      - run: npm run check:allow-email -w apps/wordbook
      - run: npm run check:sign-in-code -w apps/wordbook
      # Model-free, localhost-only, run before 2026-10-22 under a blank key.
      # `check:thinness` is a measurement, not a check. `check:decoration` and
      # `check:notes` need a running server and write today's `model_spend`:
      # they run in `voyager-e2e-shard` on shard 1, after its suite, on that
      # shard's own stack, never beside a spec that reads the row.
      - run: npm run check:translate -w apps/wordbook
      - run: npm run check:translate-model -w apps/wordbook
      - run: npm run check:unlisted -w apps/wordbook
      - run: npm run check:admission -w apps/wordbook
      # No npm script names it; the file is the check.
      - run: node --import tsx --env-file=.env.local scripts/check-budget.ts
        working-directory: apps/wordbook

  # TimeLog's policies, its key functions and the upload, driven against the real
  # database (RNT-01, RNT-02). Every row it writes belongs to users it makes and drops.
  timelog-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-install
      - uses: ./.github/actions/supabase-local
        with:
          apps: timelog
      - run: npm run check:db -w apps/timelog

  # The 12-minute suite runs here so a laptop is not holding a dev server and a
  # Chromium for it. Every job runs on its own stack, so runs never contend.
  # Every path below addresses `apps/homefund`: the suite, its `.env.local`,
  # its route types and its results directory all live there since the monorepo.
  # `apps/wordbook` has its own database and local stack, but no harness lane:
  # nothing here touches it — its checks run in the voyager jobs above and in
  # `voyager-e2e`.
  # Which of the two apps a change can actually affect. Orbit's suite is 17
  # minutes and drives the one shared remote Postgres through a single-slot
  # group, so running it for a change it cannot reach costs the whole queue.
  # Measured 2026-09-08: 1043 of the job's 1099 seconds are the suite itself —
  # there is nothing to shave in setup, only runs to not make.
  changes:
    runs-on: ubuntu-latest
    outputs:
      orbit: ${{ steps.filter.outputs.orbit }}
      voyager: ${{ steps.filter.outputs.voyager }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # `packages/` and the lockfile reach both apps; so does this workflow.
          orbit_paths="apps/homefund packages package-lock.json .github/workflows/ci.yml"
          voyager_paths="apps/wordbook packages package-lock.json .github/workflows/ci.yml"
          # Pull request: against its base. Push to `integracion`: against the
          # tip before it. Dispatch on a branch: against where it left
          # `integracion`. `main` (the deploy) and anything unresolvable run all.
          BASE_SHA=""
          if [ "$EVENT" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ "$REF" = "refs/heads/main" ]; then
            BASE_SHA=""
          elif [ "$EVENT" = "push" ]; then
            BASE_SHA="$PUSH_BEFORE"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/integracion" ]; then
            git fetch --quiet origin integracion || true
            BASE_SHA="$(git merge-base origin/integracion HEAD 2>/dev/null || true)"
          fi
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=""
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "orbit=true" >> "$GITHUB_OUTPUT"
            echo "voyager=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- $orbit_paths; then
            echo "orbit=false" >> "$GITHUB_OUTPUT"
          else
            echo "orbit=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- $voyager_paths; then
            echo "voyager=false" >> "$GITHUB_OUTPUT"
          else
            echo "voyager=true" >> "$GITHUB_OUTPUT"
          fi

  # `next build` for orbit runs nowhere else since #57 turned off preview
  # deployments. Without this job the first compile of a merged change happens in
  # the production deployment, and a broken build there hides the next one
  # (docs/TRAPS.md, "One build failure hides the next").
  #
  # `@t3-oss/env-nextjs` validates all six variables at build time and inlines the
  # three public ones, so this job needs the same secrets the suite does — and the
  # same fork guard, because GitHub hands a fork none of them.
  build-orbit:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.orbit == 'true'
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-install

      # Named here, or an empty secret surfaces inside the build as a Zod error on
      # a variable nobody set and reads like the schema broke.
      - name: Name any secret the build needs and does not have
        run: |
          missing=""
          for name in DATABASE_URL MIGRATION_DATABASE_URL NEXT_PUBLIC_SUPABASE_URL \
                      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SITE_URL CRON_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi

      # No database is reached: the build compiles and prerenders, and every route
      # that queries is dynamic. It is the compile that has to be proven here.
      - run: npm run build -w apps/homefund

  # HomeFund's three scripts against the local stack, none of them in any other
  # job. `db:check-rls` and `check:queries` open their own connection;
  # `check:http` drives a dev server like the `e2e` job's. Its RNF-09 verdict is
  # a SKIP here by design: it needs a year of movements (`seed:year`) and
  # `HARNESS_TARGET`, and neither is set, so the timing is only reported. Lane 10:
  # 9 is e2e. Not required by `main`.
  orbit-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.orbit == 'true'
    timeout-minutes: 25
    env:
      HARNESS_LANE: 10
      HARNESS_BASE_URL: http://localhost:3000
      # A test salt, not a secret: RF-143's caps key on it and pass unkeyed without it.
      CLIENT_KEY_SALT: ci-test-salt-not-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-install
      - run: npx next typegen
        working-directory: apps/homefund

      - uses: ./.github/actions/supabase-local
        with:
          apps: homefund

      - run: npm run harness:token -w apps/homefund

      # Each check runs whatever the one before did, so a red names itself.
      - run: npm run db:check-rls -w apps/homefund

      - run: npm run check:queries -w apps/homefund
        if: ${{ !cancelled() }}

      - run: npm run check:sign-in -w apps/homefund
        if: ${{ !cancelled() }}

      - name: Start the dev server and wait for it to answer
        if: ${{ !cancelled() }}
        run: |
          npm run dev -w apps/homefund > /tmp/next-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/es; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the dev server never answered"; tail -50 /tmp/next-dev.log; exit 1

      - run: npm run check:http -w apps/homefund
        if: ${{ !cancelled() }}

      - name: Upload the dev server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: orbit-checks-log
          path: /tmp/next-dev.log

  e2e-shard:
    runs-on: ubuntu-latest
    needs: changes
    # Off until the repository variable E2E_IN_CI is "true":
    #   gh variable set E2E_IN_CI --body true
    #
    # The second half: forks are skipped rather than failed, as in the other
    # suite jobs.
    if: >-
      vars.E2E_IN_CI == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.orbit == 'true'
    # The suite is one happy path per screen plus the real-bug regressions, and the
    # phone project runs only what is tagged `@mobile` (docs/agentes/verificacion.md
    # § E2E scope). Four shards keep each near two minutes of tests (6.5 min in all) plus the setup.
    timeout-minutes: 15
    # Each shard owns a runner and so a stack of its own; the lane stays 9 in
    # all four. `e2e` below is the one check name for the suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: 4
      # Its own harness identities and seeded rows, so a CI run never touches the
      # rows a local lane is driving. Lanes 1 to 5 are the checkouts.
      HARNESS_LANE: 9
      HARNESS_BASE_URL: http://localhost:3000
      CLIENT_KEY_SALT: ci-test-salt-not-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-install
      - run: npx next typegen
        working-directory: apps/homefund

      # The scripts read `.env.local` through `--env-file`, which has no fallback
      # to the process environment; the action writes it beside the app.
      - uses: ./.github/actions/supabase-local
        with:
          apps: homefund

      - uses: ./.github/actions/playwright-chromium

      # Lane 9's two identities and their token rows. Idempotent.
      - run: npm run harness:token -w apps/homefund

      # The suite runs on the build, never on `next dev`: a dev server restored from an earlier run's
      # `.next/dev/cache` stuck compiling one route and the shard ran out its timeout (historia.md § E2E on the build).
      # Only the build's own cache is kept; `next build` writes it whole before the step ends.
      - name: Restore the Turbopack build cache
        uses: actions/cache/restore@v4
        id: turbopack
        with:
          path: apps/homefund/.next/cache
          key: next-homefund-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-homefund-build-${{ hashFiles('package-lock.json') }}-

      - run: npm run build -w apps/homefund

      # The four shards build the same tree; one saves it.
      - name: Save the Turbopack build cache
        if: steps.turbopack.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: apps/homefund/.next/cache
          key: ${{ steps.turbopack.outputs.cache-primary-key }}

      - name: Start the server and wait for it to answer
        run: |
          npm run start -w apps/homefund > /tmp/next.log 2>&1 &
          # Curl rather than a `wait-on` install: nothing outside SPEC.md §4 is installed.
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/es; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 1
          done
          echo "the server never answered"; tail -50 /tmp/next.log; exit 1

      - name: Run shard ${{ matrix.shard }} of ${{ env.SHARD_TOTAL }}
        run: npm run check:e2e -w apps/homefund -- --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --reporter=blob,list

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: apps/homefund/blob-report
          retention-days: 3

      # The server log is where a red spec is explained.
      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: next-log-${{ matrix.shard }}
          path: /tmp/next.log

      - name: Upload the Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results-${{ matrix.shard }}
          path: apps/homefund/private/playwright-results-9/

  # Red when any shard is, green when all are; skipped when the shards were.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always() && needs.e2e-shard.result != 'skipped'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-install

      - uses: actions/download-artifact@v5
        with:
          pattern: e2e-blob-*
          path: apps/homefund/all-blobs
          merge-multiple: true

      - name: Merge the shards' reports
        run: npx playwright merge-reports --reporter html,list ./all-blobs
        working-directory: apps/homefund

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-report
          path: apps/homefund/playwright-report

      - name: Fail when a shard failed
        if: needs.e2e-shard.result != 'success'
        run: |
          echo "e2e: ${{ needs.e2e-shard.result }}"
          exit 1

  # `apps/wordbook`'s own browser suite. It ran nowhere until 2026-09-08, and
  # that is how two seeded specs sat red on `main` unnoticed: they opened
  # `reading-log` pinned at version 1 after module 6 raised the store to 2.
  voyager-e2e-shard:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.voyager == 'true'
    timeout-minutes: 30
    # Each shard owns a runner and so a stack of its own. `voyager-e2e` below
    # is the one check name for the suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD_TOTAL: 2
      VOYAGER_BASE_URL: http://localhost:3100
      # Arms `app/layout.tsx`'s test hook for this job's own build alone.
      # `apps/wordbook/vercel.json` names no such variable, so a Vercel build
      # never sets it and never inlines the branch it guards.
      VOYAGER_E2E_HOOKS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-install
      - run: npx next typegen
        working-directory: apps/wordbook

      # The build validates the five variables through `lib/env.ts`; the suite
      # itself reaches none of them.
      - uses: ./.github/actions/supabase-local
        with:
          apps: wordbook

      - uses: ./.github/actions/playwright-chromium

      # Production, not dev: the config says so, and module 22's counting
      # assertions need the single effect run production gives
      # (docs/TRAPS.md, "StrictMode doubles a Worker count").
      - run: npm run build -w apps/wordbook

      # `--port` explicitly: the `start` script is a bare `next start`, which
      # defaults to 3000 — only `dev` carries `--port ${PORT:-3100}`. Without
      # this the server comes up on the wrong port and the wait below times out
      # against a healthy app.
      - name: Start the app and wait for it to answer
        run: |
          npm run start -w apps/wordbook -- --port 3100 > /tmp/voyager.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3100/; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the server never answered"; tail -50 /tmp/voyager.log; exit 1

      - name: Run shard ${{ matrix.shard }} of ${{ env.SHARD_TOTAL }}
        run: npm run check:e2e -w apps/wordbook -- --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --reporter=blob,list

      # Shard 1 alone, after the suite: `check:decoration` seeds and restores
      # today's `model_spend` row, so it never runs beside a spec. A blank key
      # keeps both model-free; they reach the shard's server on localhost only.
      - name: Run check:decoration against the shard's server
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          OPENAI_API_KEY: ""
        run: npm run check:decoration -w apps/wordbook

      - name: Run check:notes against the shard's server
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          OPENAI_API_KEY: ""
        run: npm run check:notes -w apps/wordbook

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: voyager-blob-${{ matrix.shard }}
          path: apps/wordbook/blob-report
          retention-days: 3

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: voyager-log-${{ matrix.shard }}
          path: /tmp/voyager.log

      - name: Upload the Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: voyager-playwright-results-${{ matrix.shard }}
          path: apps/wordbook/private/playwright-results

  # Red when any shard is, green when all are; skipped when the shards were.
  voyager-e2e:
    runs-on: ubuntu-latest
    needs: voyager-e2e-shard
    if: always() && needs.voyager-e2e-shard.result != 'skipped'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/npm-install

      - uses: actions/download-artifact@v5
        with:
          pattern: voyager-blob-*
          path: apps/wordbook/all-blobs
          merge-multiple: true

      - name: Merge the shards' reports
        run: npx playwright merge-reports --reporter html,list ./all-blobs
        working-directory: apps/wordbook

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: voyager-e2e-report
          path: apps/wordbook/playwright-report

      - name: Fail when a shard failed
        if: needs.voyager-e2e-shard.result != 'success'
        run: |
          echo "voyager-e2e: ${{ needs.voyager-e2e-shard.result }}"
          exit 1
