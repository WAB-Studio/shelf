name: CI

on:
  pull_request:
  push:
    branches: [main, integracion]
  # So the browser suite can be driven on demand — to smoke-test the job itself,
  # or to re-run it without an empty commit.
  workflow_dispatch:

# A newer run on the same ref cancels the older one in progress; `main` is never
# cancelled, so every deploy gets its full proof.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PageProps and LayoutProps live in generated, gitignored route types.
      # One app at a time: typegen reads the app's own `app/` directory.
      - run: npx next typegen
        working-directory: apps/orbit
      - run: npx next typegen
        working-directory: apps/voyager
      - run: npx next typegen
        working-directory: apps/pulsar
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Seconds, over files already in the tree: the dictionary asset is committed,
  # so this needs no build, no browser and no secret. It runs on its own rather
  # than inside `voyager-e2e` because a red here should answer in seconds, not
  # behind a 20-minute suite. It was absent until 2026-09-10, and `D7` sat red
  # on `integracion` for a day with nothing to say so.
  dictionary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:dict -w apps/voyager

  # The pure modules, in milliseconds. `node:test` ships with Node 22, so this
  # job installs nothing the others do not. It exists so a mutation costs
  # seconds instead of the six minutes `voyager-e2e` charges: 33 tests, 255ms
  # measured 2026-09-19 against a suite that could not afford to break its own
  # code on purpose.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:unit -w apps/voyager

  # Drives the policies on `reading` against the real database, DELETE included
  # — the only proof RNL-10 has. One transaction that always rolls back, so it
  # leaves no row. Also absent until
  # 2026-09-10: the role that makes every policy apply is settled by one shared
  # statement, and nothing in CI watched it.
  policies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `check:sync` reads `--env-file=.env.local`, which the action writes.
      - uses: ./.github/actions/supabase-local
        with:
          apps: voyager
      - run: npm run check:sync -w apps/voyager
      - run: npm run check:grants -w apps/voyager
      - run: npm run check:sign-in-budget -w apps/voyager

  # The pure modules, mirrors voyager's `unit` job. No database, no secret.
  pulsar-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:unit -w apps/pulsar
      - run: npm run check:unit -w packages/harness-registry

  # Drives the `goals` policies against the real database, exactly as
  # `policies` does for `reading` — one transaction that always rolls back,
  # so it leaves no row. The npm script sets its own NODE_PATH.
  pulsar-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `check:policies` reads `--env-file=.env.local`, which the action writes.
      - uses: ./.github/actions/supabase-local
        with:
          apps: pulsar
      - run: npm run check:policies -w apps/pulsar

  # The 12-minute suite runs here so a laptop is not holding a dev server and a
  # Chromium for it. Every job runs on its own stack, so runs never contend.
  # Every path below addresses `apps/orbit`: the suite, its `.env.local`,
  # its route types and its results directory all live there since the monorepo.
  # `apps/voyager` has its own database and local stack, but no harness lane:
  # nothing here touches it — its checks run in the voyager jobs above and in
  # `voyager-e2e`.
  # Which of the two apps a change can actually affect. Orbit's suite is 17
  # minutes and drives the one shared remote Postgres through a single-slot
  # group, so running it for a change it cannot reach costs the whole queue.
  # Measured 2026-09-08: 1043 of the job's 1099 seconds are the suite itself —
  # there is nothing to shave in setup, only runs to not make.
  changes:
    runs-on: ubuntu-latest
    outputs:
      orbit: ${{ steps.filter.outputs.orbit }}
      pulsar: ${{ steps.filter.outputs.pulsar }}
      voyager: ${{ steps.filter.outputs.voyager }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # `packages/` and the lockfile reach both apps; so does this workflow.
          orbit_paths="apps/orbit packages package-lock.json .github/workflows/ci.yml"
          pulsar_paths="apps/pulsar packages package-lock.json .github/workflows/ci.yml"
          voyager_paths="apps/voyager packages package-lock.json .github/workflows/ci.yml"
          # Pull request: against its base. Push to `integracion`: against the
          # tip before it. Dispatch on a branch: against where it left
          # `integracion`. `main` (the deploy) and anything unresolvable run all.
          BASE_SHA=""
          if [ "$EVENT" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ "$REF" = "refs/heads/main" ]; then
            BASE_SHA=""
          elif [ "$EVENT" = "push" ]; then
            BASE_SHA="$PUSH_BEFORE"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/integracion" ]; then
            git fetch --quiet origin integracion || true
            BASE_SHA="$(git merge-base origin/integracion HEAD 2>/dev/null || true)"
          fi
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=""
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "orbit=true" >> "$GITHUB_OUTPUT"
            echo "pulsar=true" >> "$GITHUB_OUTPUT"
            echo "voyager=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- $orbit_paths; then
            echo "orbit=false" >> "$GITHUB_OUTPUT"
          else
            echo "orbit=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- $pulsar_paths; then
            echo "pulsar=false" >> "$GITHUB_OUTPUT"
          else
            echo "pulsar=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- $voyager_paths; then
            echo "voyager=false" >> "$GITHUB_OUTPUT"
          else
            echo "voyager=true" >> "$GITHUB_OUTPUT"
          fi

  # `next build` for orbit runs nowhere else since #57 turned off preview
  # deployments. Without this job the first compile of a merged change happens in
  # the production deployment, and a broken build there hides the next one
  # (docs/TRAPS.md, "One build failure hides the next").
  #
  # `@t3-oss/env-nextjs` validates all six variables at build time and inlines the
  # three public ones, so this job needs the same secrets the suite does — and the
  # same fork guard, because GitHub hands a fork none of them.
  build-orbit:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.orbit == 'true'
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Named here, or an empty secret surfaces inside the build as a Zod error on
      # a variable nobody set and reads like the schema broke.
      - name: Name any secret the build needs and does not have
        run: |
          missing=""
          for name in DATABASE_URL MIGRATION_DATABASE_URL NEXT_PUBLIC_SUPABASE_URL \
                      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SITE_URL CRON_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi

      # No database is reached: the build compiles and prerenders, and every route
      # that queries is dynamic. It is the compile that has to be proven here.
      - run: npm run build -w apps/orbit

  # `next build` for pulsar runs nowhere else since it ships production-only,
  # same as orbit. Unlike `build-orbit` this runs on every pull request rather
  # than only the ones a `changes` job says touch the app: pulsar is one app
  # with no sibling paths feeding it, so the fork check is the only gate.
  build-pulsar:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.pulsar == 'true'
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Named here, or an empty secret surfaces inside the build as a Zod error on
      # a variable nobody set and reads like the schema broke.
      - name: Name any secret the build needs and does not have
        run: |
          missing=""
          for name in DATABASE_URL MIGRATION_DATABASE_URL NEXT_PUBLIC_SUPABASE_URL \
                      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SITE_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi

      - run: npm run build -w apps/pulsar

  # `apps/pulsar`'s own browser suite, against `next build && next start` —
  # never `next dev`, for the reason `playwright.config.ts`'s own head gives.
  # Its own lane (8: local lanes are 1-5, orbit's CI lane is 9). The stack is
  # the runner's own, so no group serialises its runs.
  # Push only: on a pull request it is informative. The workflow's concurrency
  # group cancels the older run of a ref, so only its newest tip is proved.
  pulsar-e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.pulsar == 'true'
    # The suite is about two minutes; `playwright install --with-deps` alone
    # took eight on 2026-09-30, when apt was slow.
    timeout-minutes: 30
    # Each shard owns a runner and so a stack and a database of its own; the
    # lane stays 8 in all six. Four shards finished 4 to 8 minutes apart
    # (run 38662737576); past six, `pulsar-checks` and orbit's `e2e` set the
    # wall time. `pulsar-e2e-report` merges what they leave.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      HARNESS_LANE: 8
      SHARD_TOTAL: 6
      PULSAR_BASE_URL: http://localhost:3207
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `check:e2e` and the harness scripts its global setup spawns all read
      # `--env-file=.env.local`, which the action writes.
      - uses: ./.github/actions/supabase-local
        with:
          apps: pulsar
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils

      - run: npm run build -w apps/pulsar

      # `--port` explicitly: the `start` script is a bare `next start`, which
      # defaults to 3000 — only `dev` carries `--port ${PORT:-3200}`.
      - name: Start the app and wait for it to answer
        run: |
          npm run start -w apps/pulsar -- --port 3207 > /tmp/pulsar.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3207/; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the server never answered"; tail -50 /tmp/pulsar.log; exit 1

      # Same build, a Postgres nothing listens on: the process env wins over
      # `.env.local`. `/entrar` is static, so it answers without the database.
      - name: Start the app with an unreachable database and wait for it to answer
        run: |
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:1/postgres \
            npm run start -w apps/pulsar -- --port 3217 > /tmp/pulsar-down.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3217/entrar; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the down server never answered"; tail -50 /tmp/pulsar-down.log; exit 1

      # Same build, every `reading_lookups` read rejecting
      # (`apps/pulsar/lib/evidence/fault-seam.ts`), for `fuente-caida.spec.ts`.
      # Never set in `build-pulsar`, `pulsar-checks` or on Vercel.
      - name: Start the app with an unreadable evidence source and wait for it to answer
        run: |
          PULSAR_FAULT_SEAM=reading_lookups \
          PULSAR_MODEL_STUB=draft:${{ github.workspace }}/apps/pulsar/e2e/data/modelo-borrador.json \
          PULSAR_CHAT_STUB=script:${{ github.workspace }}/apps/pulsar/e2e/data/chat-guion.json \
          OPENAI_API_KEY=sk-stub \
            npm run start -w apps/pulsar -- --port 3227 > /tmp/pulsar-fault.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3227/entrar; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the fault server never answered"; tail -50 /tmp/pulsar-fault.log; exit 1

      # Its global setup (`scripts/harness/e2e-run.ts`) opens the one harness
      # run, mints and seeds lane 8's person under it — no typed address, no
      # email sent (RNP-09) — and its teardown drops every identity and closes
      # the run.
      - name: Run shard ${{ matrix.shard }} of ${{ env.SHARD_TOTAL }}, caida and fuente projects included
        env:
          PULSAR_DOWN_BASE_URL: http://localhost:3217
          PULSAR_FAULT_BASE_URL: http://localhost:3227
        run: npm run check:e2e -w apps/pulsar -- --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --reporter=blob,list

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pulsar-blob-${{ matrix.shard }}
          path: apps/pulsar/blob-report
          retention-days: 3

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pulsar-log-${{ matrix.shard }}
          path: /tmp/pulsar.log

      - name: Upload the down server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pulsar-down-log-${{ matrix.shard }}
          path: /tmp/pulsar-down.log

      - name: Upload the fault server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pulsar-fault-log-${{ matrix.shard }}
          path: /tmp/pulsar-fault.log

      - name: Upload the Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pulsar-playwright-results-${{ matrix.shard }}
          path: apps/pulsar/private/playwright-results

  # One check name for the suite: red when any shard is, green when all are.
  # `always()` so a red shard still gets its report merged.
  pulsar-e2e-report:
    runs-on: ubuntu-latest
    needs: pulsar-e2e
    if: always() && needs.pulsar-e2e.result != 'skipped'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v5
        with:
          pattern: pulsar-blob-*
          path: apps/pulsar/all-blobs
          merge-multiple: true

      - name: Merge the shards' reports
        run: npx playwright merge-reports --reporter html,list ./all-blobs
        working-directory: apps/pulsar

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pulsar-e2e-report
          path: apps/pulsar/playwright-report

      - name: Fail when a shard failed
        if: needs.pulsar-e2e.result != 'success'
        run: |
          echo "pulsar-e2e: ${{ needs.pulsar-e2e.result }}"
          exit 1

  # `check:day`, `check:goal`, `check:goal-actions` and `check:plan` under one harness run of
  # their own, then `check:mcp` on a session of its own (`scripts/harness/checks-run.ts`), never `pulsar-e2e`'s person:
  # its teardown drops it. A job of its own so the two run side by side. Lane
  # 7: local lanes are 1-5, `pulsar-e2e` is 8, orbit's `e2e` is 9, so the
  # shared `harness-member-7` never meets another job's seeds.
  pulsar-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.pulsar == 'true'
    timeout-minutes: 25
    env:
      HARNESS_LANE: 7
      PULSAR_BASE_URL: http://localhost:3206
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Orbit is there for `harness:token`.
      - uses: ./.github/actions/supabase-local
        with:
          apps: pulsar orbit

      # Creates or refreshes lane 7's shared pair; idempotent.
      - run: npm run harness:token -w apps/orbit

      - run: npm run check:e2e-static -w apps/pulsar

      - run: npm run build -w apps/pulsar

      - name: Start the app and wait for it to answer
        run: |
          # `check:mcp` reads this log at `private/dev3206.log` and asserts an `[outbound]` line
          # that only this fetch hook writes.
          mkdir -p apps/pulsar/private
          NODE_OPTIONS='--import data:text/javascript,const%20f=fetch;globalThis.fetch=(i,o)=>{console.log(%22[outbound]%22,String(i.url??i));return%20f(i,o)}' \
            npm run start -w apps/pulsar -- --port 3206 > apps/pulsar/private/dev3206.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3206/; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the server never answered"; tail -50 apps/pulsar/private/dev3206.log; exit 1

      - name: Run the four checks under one harness run
        working-directory: apps/pulsar
        run: node --import tsx --env-file=.env.local scripts/harness/checks-run.ts

      # `route.ts` reads `private/session-7.json`, which `checks-run.ts` drops with its run;
      # a bare mint leaves a session of its own for this step.
      - name: Run check:mcp
        if: ${{ !cancelled() }}
        run: |
          npm run harness:mint-session -w apps/pulsar
          npm run check:mcp -w apps/pulsar

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pulsar-checks-log
          path: apps/pulsar/private/dev3206.log

  # HomeFund's three scripts against the local stack, none of them in any other
  # job. `db:check-rls` and `check:queries` open their own connection;
  # `check:http` drives a dev server like the `e2e` job's. Its RNF-09 verdict is
  # a SKIP here by design: it needs a year of movements (`seed:year`) and
  # `HARNESS_TARGET`, and neither is set, so the timing is only reported. Lane 10:
  # 7 is pulsar-checks, 8 pulsar-e2e, 9 e2e. Not required by `main`.
  orbit-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.orbit == 'true'
    timeout-minutes: 25
    env:
      HARNESS_LANE: 10
      HARNESS_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
        working-directory: apps/orbit

      - uses: ./.github/actions/supabase-local
        with:
          apps: orbit

      - run: npm run harness:token -w apps/orbit

      # Each check runs whatever the one before did, so a red names itself.
      - run: npm run check:unit --if-present -w apps/orbit
      - run: npm run db:check-rls -w apps/orbit

      - run: npm run check:queries -w apps/orbit
        if: ${{ !cancelled() }}

      - name: Start the dev server and wait for it to answer
        if: ${{ !cancelled() }}
        run: |
          npm run dev -w apps/orbit > /tmp/next-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/es; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the dev server never answered"; tail -50 /tmp/next-dev.log; exit 1

      - run: npm run check:http -w apps/orbit
        if: ${{ !cancelled() }}

      - name: Upload the dev server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: orbit-checks-log
          path: /tmp/next-dev.log

  e2e:
    runs-on: ubuntu-latest
    needs: changes
    # Off until the repository variable E2E_IN_CI is "true":
    #   gh variable set E2E_IN_CI --body true
    #
    # The second half: forks are skipped rather than failed, as in the other
    # suite jobs.
    if: >-
      vars.E2E_IN_CI == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.orbit == 'true'
    timeout-minutes: 40
    env:
      # Its own harness identities and seeded rows, so a CI run never touches the
      # rows a local lane is driving. Lanes 1 to 5 are the checkouts.
      HARNESS_LANE: 9
      HARNESS_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
        working-directory: apps/orbit

      # The scripts read `.env.local` through `--env-file`, which has no fallback
      # to the process environment; the action writes it beside the app.
      - uses: ./.github/actions/supabase-local
        with:
          apps: orbit

      - run: npx playwright install --with-deps chromium

      # Lane 9's two identities and their token rows. Idempotent.
      - run: npm run harness:token -w apps/orbit

      - name: Start the dev server and wait for it to answer
        run: |
          npm run dev -w apps/orbit > /tmp/next-dev.log 2>&1 &
          # Curl rather than a `wait-on` install: nothing outside SPEC.md §4 is
          # installed. Dev compiles a route on its first hit, so the wait is for
          # the first page to render, not for the port to open.
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/es; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the dev server never answered"; tail -50 /tmp/next-dev.log; exit 1

      - run: npm run check:e2e -w apps/orbit

      # The server log is where a red spec is explained.
      - name: Upload the dev server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: next-dev-log
          path: /tmp/next-dev.log

      - name: Upload the Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: apps/orbit/private/playwright-results-9/

  # `apps/voyager`'s own browser suite. It ran nowhere until 2026-09-08, and
  # that is how two seeded specs sat red on `main` unnoticed: they opened
  # `reading-log` pinned at version 1 after module 6 raised the store to 2.
  voyager-e2e-shard:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.voyager == 'true'
    timeout-minutes: 30
    # Each shard owns a runner and so a stack of its own. `voyager-e2e` below
    # is the one check name for the suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD_TOTAL: 3
      VOYAGER_BASE_URL: http://localhost:3100
      # Arms `app/layout.tsx`'s test hook for this job's own build alone.
      # `apps/voyager/vercel.json` names no such variable, so a Vercel build
      # never sets it and never inlines the branch it guards.
      VOYAGER_E2E_HOOKS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
        working-directory: apps/voyager

      # The build validates the five variables through `lib/env.ts`; the suite
      # itself reaches none of them.
      - uses: ./.github/actions/supabase-local
        with:
          apps: voyager

      - run: npx playwright install --with-deps chromium

      # Production, not dev: the config says so, and module 22's counting
      # assertions need the single effect run production gives
      # (docs/TRAPS.md, "StrictMode doubles a Worker count").
      - run: npm run build -w apps/voyager

      # `--port` explicitly: the `start` script is a bare `next start`, which
      # defaults to 3000 — only `dev` carries `--port ${PORT:-3100}`. Without
      # this the server comes up on the wrong port and the wait below times out
      # against a healthy app.
      - name: Start the app and wait for it to answer
        run: |
          npm run start -w apps/voyager -- --port 3100 > /tmp/voyager.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3100/; then
              echo "up after ${SECONDS}s"; exit 0
            fi
            sleep 2
          done
          echo "the server never answered"; tail -50 /tmp/voyager.log; exit 1

      - name: Run shard ${{ matrix.shard }} of ${{ env.SHARD_TOTAL }}
        run: npm run check:e2e -w apps/voyager -- --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --reporter=blob,list

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: voyager-blob-${{ matrix.shard }}
          path: apps/voyager/blob-report
          retention-days: 3

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: voyager-log-${{ matrix.shard }}
          path: /tmp/voyager.log

      - name: Upload the Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: voyager-playwright-results-${{ matrix.shard }}
          path: apps/voyager/private/playwright-results

  # Red when any shard is, green when all are; skipped when the shards were.
  voyager-e2e:
    runs-on: ubuntu-latest
    needs: voyager-e2e-shard
    if: always() && needs.voyager-e2e-shard.result != 'skipped'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v5
        with:
          pattern: voyager-blob-*
          path: apps/voyager/all-blobs
          merge-multiple: true

      - name: Merge the shards' reports
        run: npx playwright merge-reports --reporter html,list ./all-blobs
        working-directory: apps/voyager

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: voyager-e2e-report
          path: apps/voyager/playwright-report

      - name: Fail when a shard failed
        if: needs.voyager-e2e-shard.result != 'success'
        run: |
          echo "voyager-e2e: ${{ needs.voyager-e2e-shard.result }}"
          exit 1
