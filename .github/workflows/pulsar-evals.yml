# Pulsar's import and chat against the real model, graded by code (apps/pulsar/evals).
# Spends money, so never on a push or a pull request: by hand, and once a week.
# Secret to add by hand in the repo settings: OPENAI_API_KEY (the key pulsar's server uses).
name: pulsar-evals

on:
  workflow_dispatch:
    inputs:
      k:
        description: "Runs per case (pass^k)"
        default: "3"
      only:
        description: "Case id or prefix, e.g. chat/ or import/hierarchy-3-levels (empty: all)"
        default: ""
      max_usd:
        description: "Stop launching runs past this estimated spend"
        default: "10"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: pulsar-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the evals
        working-directory: apps/pulsar
        env:
          EVALS: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALS_K: ${{ inputs.k || '3' }}
          EVALS_MAX_USD: ${{ inputs.max_usd || '10' }}
          EVALS_OUT: ${{ github.workspace }}/private/evals
          ONLY: ${{ inputs.only }}
        run: npm run evals -- ${ONLY:+--only="$ONLY"}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pulsar-evals
          path: private/evals
          if-no-files-found: ignore
