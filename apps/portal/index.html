<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C9A8D8">
<title>Shelf</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="HomeFund, WordBook y GoalLog, en un solo lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a phone's home screen scaled to the window — soft colour wallpaper, the time large, three white app cards filling the middle. One look for both themes. */
:root {
  --card: rgba(255, 255, 255, .92);
  --card-ink: #1D1D1F;
  --card-muted: #6E6E73;
  --link: #0066CC;
  --sans: -apple-system, "SF Pro Display", "Inter Tight", "Segoe UI", system-ui, sans-serif;
  /* one unit that grows with the window's height and is held back by its width */
  --u: min(1vh, .62vw);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { min-height: 100%; background-color: #C9A8D8; }
body {
  margin: 0;
  min-height: 100vh; min-height: 100dvh;
  background-color: #C9A8D8;
  background-image:
    radial-gradient(120% 90% at 10% 0%, #F7B98B 0%, transparent 55%),
    radial-gradient(120% 90% at 100% 100%, #7E9BF0 0%, transparent 55%),
    radial-gradient(90% 80% at 80% 10%, #74D8BD 0%, transparent 50%);
  background-attachment: fixed;
  color: #fff;
  font-family: var(--sans);
  padding-inline: 20px;
  padding-block: max(44px, calc(var(--u) * 8)) max(32px, calc(var(--u) * 6));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 5);
}
.clock { text-align: center; text-shadow: 0 1px 14px rgba(0, 0, 0, .12); }
.clock b { display: block; font-size: max(64px, calc(var(--u) * 12)); font-weight: 600; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.clock span { display: block; margin-top: calc(var(--u) * 1); font-size: max(17px, calc(var(--u) * 2.1)); font-weight: 500; }
h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: max(16px, calc(var(--u) * 2)); width: 100%; max-width: calc(var(--u) * 112); }
@media (max-width: 760px) { .row { grid-template-columns: 1fr; max-width: 420px; } }

.card {
  height: 100%;
  min-height: max(200px, calc(var(--u) * 28));
  background: var(--card); color: var(--card-ink);
  border-radius: max(22px, calc(var(--u) * 2.8)); padding: max(22px, calc(var(--u) * 3));
  display: flex; flex-direction: column; gap: max(12px, calc(var(--u) * 1.4));
  text-decoration: none;
  box-shadow: 0 10px 30px rgba(40, 20, 60, .12);
  transition: transform .25s ease, box-shadow .25s ease;
}
.card:hover { transform: translateY(-6px); box-shadow: 0 22px 50px rgba(40, 20, 60, .2); }
.card:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.ico { width: max(56px, calc(var(--u) * 7)); height: max(56px, calc(var(--u) * 7)); border-radius: 23%; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .12); }
.ico svg { width: 54%; height: 54%; }
.card h2 { margin: calc(var(--u) * 1) 0 0; font-size: max(22px, calc(var(--u) * 3)); font-weight: 600; letter-spacing: -.02em; }
.card p { margin: 0; color: var(--card-muted); font-size: max(15px, calc(var(--u) * 1.75)); line-height: 1.4; }
.more { margin-top: auto; padding-top: 4px; color: var(--link); font-size: max(15px, calc(var(--u) * 1.75)); }
@media (max-width: 760px) { .card { min-height: 0; } }

@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<h1>Shelf</h1>
<div class="clock" aria-hidden="true"><b id="time">9:41</b><span id="date">hoy</span></div>

<ul class="row">
  <li>
    <a class="card" href="https://our-piggy-bank.vercel.app">
      <span class="ico" style="background:#2F5BEA" aria-hidden="true"><svg viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="17" cy="17" r="5" fill="#fff"/><ellipse cx="17" cy="17" rx="14" ry="6" transform="rotate(-25 17 17)"/></svg></span>
      <h2>HomeFund</h2>
      <p>El fondo compartido: cuentas y saldos entre varias personas.</p>
      <span class="more" aria-hidden="true">Abrir ›</span>
    </a>
  </li>
  <li>
    <a class="card" href="https://reading-neon.vercel.app">
      <span class="ico" style="background:#1C1B16" aria-hidden="true"><svg viewBox="0 0 34 34" fill="none" stroke="#D9805F" stroke-width="2.2"><path d="M6 8h9a3 3 0 0 1 3 3v15a2 2 0 0 0-2-2H6zM28 8h-9a3 3 0 0 0-3 3v15a2 2 0 0 1 2-2h10z"/></svg></span>
      <h2>WordBook</h2>
      <p>El diccionario de lectura: una palabra sin soltar el libro.</p>
      <span class="more" aria-hidden="true">Abrir ›</span>
    </a>
  </li>
  <li>
    <a class="card" href="https://pulsar-psi-six.vercel.app">
      <span class="ico" style="background:#1C6E5A" aria-hidden="true"><svg viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="17" cy="17" r="3" fill="#fff"/><circle cx="17" cy="17" r="8" opacity=".7"/><circle cx="17" cy="17" r="13" opacity=".4"/></svg></span>
      <h2>GoalLog</h2>
      <p>La bitácora de metas: hoy, la semana y el plan del mes.</p>
      <span class="more" aria-hidden="true">Abrir ›</span>
    </a>
  </li>
</ul>

<script>
(() => {
  const time = document.getElementById("time"), date = document.getElementById("date");
  const tick = () => {
    try {
      const now = new Date();
      time.textContent = new Intl.DateTimeFormat("es-CO", { hour: "numeric", minute: "2-digit" }).formatToParts(now).filter((p) => p.type === "hour" || p.type === "minute" || (p.type === "literal" && p.value === ":")).map((p) => p.value).join("");
      date.textContent = new Intl.DateTimeFormat("es-CO", { weekday: "long", day: "numeric", month: "long" }).format(now).replace(",", "");
    } catch (e) {}
  };
  tick();
  setInterval(tick, 15000);
})();
</script>
</body>
</html>
